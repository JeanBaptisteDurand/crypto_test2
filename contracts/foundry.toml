[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

# Robinhood Chain has no Pons V2 deployment on its testnet, so every integration test forks mainnet.
# `rpc-proxy.mjs` is what makes that reachable from forge at all -- see the comment in that file.
[rpc_endpoints]
rhc = "${RHC_RPC}"
